plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def signingStoreFilePath = localProps.getProperty("signing.storeFile") ?: System.getenv("SIGNING_STORE_FILE")
def signingStorePassword = localProps.getProperty("signing.storePassword") ?: System.getenv("SIGNING_STORE_PASSWORD")
def signingKeyAlias = localProps.getProperty("signing.keyAlias") ?: System.getenv("SIGNING_KEY_ALIAS")
def signingKeyPassword = localProps.getProperty("signing.keyPassword") ?: System.getenv("SIGNING_KEY_PASSWORD")
def hasCustomSigning = signingStoreFilePath && signingStorePassword && signingKeyAlias && signingKeyPassword && file(signingStoreFilePath).exists()

android {
    namespace 'com.agustin.whitenoise'
    compileSdk 34

    defaultConfig {
        applicationId "com.agustin.whitenoise"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.2.2"
    }

    signingConfigs {
        if (hasCustomSigning) {
            appSign {
                storeFile file(signingStoreFilePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasCustomSigning) {
                signingConfig signingConfigs.appSign
            }
        }
        release {
            if (hasCustomSigning) {
                signingConfig signingConfigs.appSign
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def mobileDropDir = new File(System.getProperty("user.home"), "Documents/Mobile Drop")
        if (mobileDropDir.exists()) {
            def copyTask = tasks.register("copy${variant.name.capitalize()}ToMobileDrop", Copy) {
                from output.outputFile
                into mobileDropDir
                rename { String fileName -> "WhiteNoise-v${variant.versionName}.apk" }
            }
            variant.assembleProvider.get().finalizedBy(copyTask)
        }
    }
}
